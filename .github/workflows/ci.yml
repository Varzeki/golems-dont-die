# Checks every push and pull request the way the Plugin Hub will: builds and tests the plugin, runs the
# hub's own packager on it, keeps it under the review bot's token limit, and looks for what reviewers
# have sent plugins back for. Runs only on GitHub; nothing here ships with the plugin.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 11
          cache: gradle
      - run: chmod +x gradlew && ./gradlew build --no-daemon

  checks:
    name: Review checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install tiktoken
      - name: Review bot token budget
        run: python .github/scripts/count_tokens.py
      - name: Hub review lint
        if: ${{ !cancelled() }}
        run: python .github/scripts/hub_lint.py

  hub-packager:
    # The hub's own build of this commit, set up as their CI sets it up. Advisory: it uses their
    # tooling, which can change under us, so a failure here is a prompt to look rather than a block.
    name: Plugin Hub packager
    runs-on: ubuntu-24.04
    continue-on-error: true
    env:
      REPOSITORY: ${{ github.event.pull_request.head.repo.clone_url || format('{0}/{1}.git', github.server_url, github.repository) }}
      COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: runelite/plugin-hub
          path: plugin-hub
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 11
      - name: Fetch the packager
        run: |
          set -exu
          curl --location --fail --retry 4 --max-time 30 --output bundle.tar.zst \
            "https://github.com/runelite/plugin-hub-tooling/releases/download/v1/bundle.tar.zst"
          tar xf bundle.tar.zst
      - uses: actions/cache/restore@v5
        id: restore-cache
        with:
          path: |
            ~/.gradle/caches/
            api/
          key: hub-deps-${{ hashFiles('plugin-hub/runelite.version', 'bundle.tar.zst') }}
      - name: Prepare
        if: steps.restore-cache.outputs.cache-hit != 'true'
        run: ./prepare.sh
      - uses: actions/cache/save@v5
        if: steps.restore-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.gradle/caches/
            api/
          key: ${{ steps.restore-cache.outputs.cache-primary-key }}
      - name: Point our entry at this commit
        run: |
          set -eu
          printf 'repository=%s\ncommit=%s\n' "$REPOSITORY" "$COMMIT" > plugin-hub/plugins/golems-dont-die
          git -C plugin-hub -c user.name=ci -c user.email=ci@localhost commit -q -am "Test golems-dont-die at $COMMIT"
      - name: Package
        env:
          FORCE_BUILD: golems-dont-die
          # As the hub's own CI does for a pull request: build and check, never upload.
          PACKAGE_IS_PR: "true"
        run: |
          # Nothing the build prints is taken as a workflow command.
          COMMAND_SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::$COMMAND_SECRET"
          echo "::stop-commands::$COMMAND_SECRET"
          exec java -XX:+UseParallelGC -cp package.jar net.runelite.pluginhub.packager.Packager
